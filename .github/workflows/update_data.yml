name: S&P500 Daily Update

on:
  schedule:
    # Jalankan setiap hari jam 05:00 UTC (sebelum pasar AS buka)
    - cron: '0 5 * * *'
  workflow_dispatch: # Bisa di-trigger manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate JSON Data
        run: python generate_data.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'bot@github.com'
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data.json" && git push)
