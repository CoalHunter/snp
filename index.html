<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF Spot Detectors</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#30363d;
  --text:#e6edf3;--text2:#8b949e;--text3:#6e7681;
  --blue:#58a6ff;--blue-bg:rgba(88,166,255,.12);
  --green:#3fb950;--green-bg:rgba(63,185,80,.12);
  --red:#f85149;--red-bg:rgba(248,81,73,.12);
  --orange:#d29922;--orange-bg:rgba(210,153,34,.12);
  --border:#30363d;--radius:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4}

.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{font-size:16px;font-weight:700;color:var(--blue);white-space:nowrap;display:flex;align-items:center;gap:6px}
.search-box{flex:1;min-width:0}
.search-box input{width:100%;padding:7px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;outline:none}
.search-box input:focus{border-color:var(--blue)}
.search-box input::placeholder{color:var(--text3)}
.badge-dark{font-size:12px;color:var(--text2);white-space:nowrap;display:flex;align-items:center;gap:4px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.stat{background:var(--bg2);padding:10px 14px;display:flex;align-items:center;gap:10px}
.stat-icon{font-size:18px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border-radius:6px;flex-shrink:0}
.stat-info{min-width:0}
.stat-label{font-size:11px;color:var(--text3)}
.stat-value{font-size:16px;font-weight:700;color:var(--blue)}

.filters{background:var(--bg2);padding:8px 12px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--border);scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fbtn{padding:6px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:16px;color:var(--text2);font-size:12px;cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0}
.fbtn:hover{border-color:var(--blue);color:var(--text)}
.fbtn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.fbtn.ready{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.fbtn.ready.active{background:var(--green);color:#fff}

.sorts{background:var(--bg2);padding:6px 12px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--border);scrollbar-width:none}
.sorts::-webkit-scrollbar{display:none}
.sbtn{padding:5px 10px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text3);font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.sbtn:hover{border-color:var(--blue);color:var(--text)}
.sbtn.active{background:var(--bg3);border-color:var(--blue);color:var(--blue)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:12px;max-width:1400px;margin:0 auto}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1280px){.grid{grid-template-columns:repeat(5,1fr)}}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .2s}
.card:hover{border-color:var(--blue);transform:translateY(-2px)}
.card.ready{border-color:var(--green)}
.card.ready:hover{box-shadow:0 4px 12px rgba(63,185,80,.2)}
.card-top{padding:10px;text-align:center;background:var(--bg3);border-bottom:1px solid var(--border)}
.card-ticker{font-size:22px;font-weight:700;color:var(--blue);letter-spacing:1px}
.card-price{font-size:15px;font-weight:600;color:var(--text);margin-top:2px}
.card-body{padding:8px 10px}
.card-name{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.card-badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;min-height:20px}
.badge{padding:2px 6px;border-radius:3px;font-size:9px;font-weight:600;white-space:nowrap}
.b-cat{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.b-acc{background:var(--green-bg);color:var(--green);border:1px solid var(--green);animation:pulse 2s infinite}
.b-ready{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange)}
.b-neu{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.b-score{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.card-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding-top:6px;border-top:1px solid var(--border)}
.cs-l{font-size:9px;color:var(--text3)}
.cs-v{font-size:11px;font-weight:600;color:var(--text)}
.cs-v.grn{color:var(--green)}.cs-v.org{color:var(--orange)}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;justify-content:center;align-items:flex-end;backdrop-filter:blur(2px)}
.modal.active{display:flex}
.modal-content{background:var(--bg2);width:100%;max-width:560px;max-height:85vh;border-radius:12px 12px 0 0;overflow-y:auto;animation:slideUp .25s ease}
@media(min-width:640px){.modal{align-items:center;padding:20px}.modal-content{border-radius:12px}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg2);z-index:10}
.modal-title{font-size:16px;font-weight:700;color:var(--blue)}
.modal-close{background:none;border:none;color:var(--text2);font-size:22px;cursor:pointer;padding:4px 8px}
.modal-close:hover{color:var(--text)}
.modal-body{padding:14px 16px}
.m-sec{margin-bottom:16px}
.m-title{font-size:13px;font-weight:600;color:var(--blue);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.m-item{background:var(--bg3);padding:8px 10px;border-radius:6px;border:1px solid var(--border)}
.m-item.full{grid-column:span 2}
.m-l{font-size:10px;color:var(--text3);text-transform:uppercase}
.m-v{font-size:13px;font-weight:600;color:var(--text);margin-top:2px}
.azones{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.az{padding:10px 8px;border-radius:6px;text-align:center;border:1.5px solid var(--border);background:var(--bg3)}
.az.buy{border-color:var(--green);background:var(--green-bg)}
.az.target{border-color:var(--orange);background:var(--orange-bg)}
.az.stop{border-color:var(--red);background:var(--red-bg)}
.az-l{font-size:9px;color:var(--text3);text-transform:uppercase}
.az-v{font-size:14px;font-weight:700;color:var(--text);margin-top:2px}
.banner{background:var(--green-bg);border:1px solid var(--green);color:var(--green);padding:8px 12px;border-radius:6px;font-size:12px;font-weight:600;text-align:center;margin-bottom:14px}
.loading,.empty{text-align:center;padding:40px 20px;color:var(--text2);grid-column:1/-1}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:480px){.logo{font-size:14px}.stat-value{font-size:14px}.card-ticker{font-size:18px}.card-price{font-size:13px}.azones{grid-template-columns:1fr}.m-item.full{grid-column:span 1}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">📊 ETF Detectors</div>
  <div class="search-box"><input type="text" id="searchInput" placeholder="Cari ticker..."></div>
  <div class="badge-dark"> Dark</div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-icon">📈</div><div class="stat-info"><div class="stat-label">Total ETF</div><div class="stat-value" id="sTotal">0</div></div></div>
  <div class="stat"><div class="stat-icon">🔥</div><div class="stat-info"><div class="stat-label">Akumulasi Aktif</div><div class="stat-value" id="sAccum">0</div></div></div>
  <div class="stat"><div class="stat-icon">💰</div><div class="stat-info"><div class="stat-label">Siap Akumulasi</div><div class="stat-value" id="sReady">0</div></div></div>
  <div class="stat"><div class="stat-icon">⏱️</div><div class="stat-info"><div class="stat-label">Update (WIB)</div><div class="stat-value" id="sTime" style="font-size:12px">-</div></div></div>
</div>

<div class="filters" id="filterContainer"></div>
<div class="sorts" id="sortContainer"></div>

<div class="grid" id="grid">
  <div class="loading"><div class="spinner"></div>Memuat data...</div>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-header"><div class="modal-title" id="mTitle">-</div><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<script>
let allData = [], filteredData = [], curCat = 'all', curSort = 'default', searchQuery = '';

const FILTERS = [
  { id: 'all', label: 'Semua', special: false },
  { id: 'ready', label: '💰 Siap Akumulasi', special: true },
];

const SORTS = [
  { id: 'default', label: 'Default' },
  { id: 'score', label: 'Swing Score' },
  { id: 'profit', label: 'Profit Tertinggi' },
  { id: 'dividend', label: 'Dividen Tertinggi' },
  { id: 'distance', label: 'Dekat Bottom' },
  { id: 'price-asc', label: 'Harga Terendah' },
];

const toWIB = t => {
  if (!t) return '-';
  const d = new Date(t.replace(' ', 'T') + 'Z');
  if (isNaN(d)) return t;
  d.setHours(d.getHours() + 7);
  return d.toISOString().replace('T', ' ').slice(0, 19);
};

const isReady = s => {
  const dist = parseFloat(s.collector_status?.distance_from_low) || 999;
  return dist < 5 || s.collector_status?.is_accumulating;
};

const parseNum = v => {
  if (v === null || v === undefined || v === 'N/A') return 0;
  const n = parseFloat(String(v).replace('%', ''));
  return isNaN(n) ? 0 : n;
};

function calculateSwingScore(s) {
    let score = 0;
    if (s.collector_status?.is_accumulating) {
        score += 20;
        const volPct = s.collector_status.up_vol_pct || 0;
        if (volPct > 70) score += 15;
        else if (volPct > 60) score += 10;
        else if (volPct > 55) score += 5;
    }
    const profit = parseFloat(s.action_plan?.potential_profit) || 0;
    if (profit > 15) score += 30; else if (profit > 10) score += 25; else if (profit > 8) score += 20; else if (profit > 6) score += 15; else if (profit > 4) score += 10; else score += 5;
    const verdict = s.fundamental?.verdict || '';
    if (verdict === 'MURAH') score += 20; else if (verdict === 'WAJAR') score += 15; else if (verdict.includes('N/A')) score += 10; else score += 5;
    const distance = parseFloat(s.collector_status?.distance_from_low) || 999;
    if (distance < 3) score += 15; else if (distance < 5) score += 12; else if (distance < 8) score += 8; else if (distance < 12) score += 5; else score += 2;
    return {
        total: score,
        grade: score >= 85 ? 'A+' : score >= 75 ? 'A' : score >= 65 ? 'B+' : score >= 55 ? 'B' : score >= 45 ? 'C+' : 'C'
    };
}

function renderFilters() {
  const container = document.getElementById('filterContainer');
  const cats = [...new Set(allData.map(s => s.category).filter(Boolean))];
  const allFilters = [...FILTERS, ...cats.map(c => ({ id: c, label: c, special: false }))];

  container.innerHTML = allFilters.map(f => {
    const cls = `fbtn${f.special ? ' ready' : ''}${f.id === curCat ? ' active' : ''}`;
    return `<button class="${cls}" data-cat="${f.id}">${f.label}</button>`;
  }).join('');

  container.querySelectorAll('.fbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      curCat = btn.dataset.cat;
      renderFilters();
      applyFilters();
    });
  });
}

function renderSorts() {
  const container = document.getElementById('sortContainer');
  container.innerHTML = SORTS.map(s => {
    const cls = `sbtn${s.id === curSort ? ' active' : ''}`;
    return `<button class="${cls}" data-sort="${s.id}">${s.label}</button>`;
  }).join('');

  container.querySelectorAll('.sbtn').forEach(btn => {
    btn.addEventListener('click', () => {
      curSort = btn.dataset.sort;
      renderSorts();
      applyFilters();
    });
  });
}

function updateStats(d) {
  document.getElementById('sTotal').textContent = d.total_etf || allData.length;
  document.getElementById('sAccum').textContent = allData.filter(s => s.collector_status?.is_accumulating).length;
  document.getElementById('sReady').textContent = allData.filter(s => isReady(s)).length;
  document.getElementById('sTime').textContent = toWIB(d.last_updated);
}

function applyFilters() {
  const q = searchQuery.toLowerCase();

  filteredData = allData.filter(s => {
    let matchCat = false;
    if (curCat === 'all') matchCat = true;
    else if (curCat === 'ready') matchCat = isReady(s);
    else matchCat = s.category === curCat;

    const matchSearch = !q ||
      (s.ticker && s.ticker.toLowerCase().includes(q)) ||
      (s.name && s.name.toLowerCase().includes(q));

    return matchCat && matchSearch;
  });

  const sorters = {
    'default': () => 0,
    'score': (a, b) => calculateSwingScore(b).total - calculateSwingScore(a).total,
    'profit': (a, b) => parseNum(b.action_plan?.potential_profit) - parseNum(a.action_plan?.potential_profit),
    'dividend': (a, b) => parseNum(b.fundamental?.dividend_yield) - parseNum(a.fundamental?.dividend_yield),
    'distance': (a, b) => parseNum(a.collector_status?.distance_from_low) - parseNum(b.collector_status?.distance_from_low),
    'price-asc': (a, b) => (a.current_price || 0) - (b.current_price || 0),
  };

  const sorter = sorters[curSort] || sorters['default'];
  if (curSort !== 'default') {
    filteredData.sort(sorter);
  }

  renderGrid();
}

function renderGrid() {
  const g = document.getElementById('grid');

  if (!filteredData.length) {
    g.innerHTML = '<div class="empty"> Tidak ada data yang cocok</div>';
    return;
  }

  g.innerHTML = filteredData.map(s => {
    const acc = s.collector_status?.is_accumulating;
    const ready = isReady(s);
    const div = s.fundamental?.dividend_yield || 'N/A';
    const pe = s.fundamental?.pe_ratio || 'N/A';
    const profit = s.action_plan?.potential_profit || 'N/A';
    const upVol = s.collector_status?.up_vol_pct ?? 0;
    const scoreData = calculateSwingScore(s);

    return `<div class="card${ready ? ' ready' : ''}" onclick="openModal('${s.ticker}')">
      <div class="card-top">
        <div class="card-ticker">${s.ticker}</div>
        <div class="card-price">$${(s.current_price || 0).toFixed(2)}</div>
      </div>
      <div class="card-body">
        <div class="card-name">${s.name || '-'}</div>
        <div class="card-badges">
          <span class="badge b-cat">${s.category || '-'}</span>
          ${acc ? '<span class="badge b-acc">🔥 Akumulasi</span>' : '<span class="badge b-neu"> Netral</span>'}
          ${ready && !acc ? '<span class="badge b-ready"> Siap</span>' : ''}
          <span class="badge b-score">Score: ${scoreData.total} (${scoreData.grade})</span>
        </div>
        <div class="card-stats">
          <div><div class="cs-l">P/E</div><div class="cs-v">${pe}</div></div>
          <div><div class="cs-l">Dividen</div><div class="cs-v">${div}</div></div>
          <div><div class="cs-l">Up Vol</div><div class="cs-v">${upVol}%</div></div>
          <div><div class="cs-l">Target</div><div class="cs-v org">+${profit}</div></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openModal(ticker) {
  const s = allData.find(x => x.ticker === ticker);
  if (!s) return;
  const ready = isReady(s);

  document.getElementById('mTitle').textContent = `${s.ticker} — ${s.name || ''}`;
  document.getElementById('mBody').innerHTML = `
    ${ready ? '<div class="banner">💰 ETF ini siap diakumulasi — Harga dekat bottom atau terdeteksi akumulasi bandar</div>' : ''}

    <div class="m-sec">
      <div class="m-title">📊 Informasi Dasar</div>
      <div class="m-grid">
        <div class="m-item"><div class="m-l">Kategori</div><div class="m-v">${s.category || '-'}</div></div>
        <div class="m-item"><div class="m-l">Harga</div><div class="m-v">$${(s.current_price || 0).toFixed(2)}</div></div>
        <div class="m-item"><div class="m-l">Status</div><div class="m-v">${s.collector_status?.is_accumulating ? '🔥 Akumulasi' : '⚪ Netral'}</div></div>
        <div class="m-item"><div class="m-l">Up Volume</div><div class="m-v">${s.collector_status?.up_vol_pct ?? 0}%</div></div>
      </div>
    </div>

    <div class="m-sec">
      <div class="m-title">💹 Fundamental</div>
      <div class="m-grid">
        <div class="m-item"><div class="m-l">P/E Ratio</div><div class="m-v">${s.fundamental?.pe_ratio ?? 'N/A'}</div></div>
        <div class="m-item"><div class="m-l">Dividen Yield</div><div class="m-v">${s.fundamental?.dividend_yield ?? 'N/A'}</div></div>
        <div class="m-item full"><div class="m-l">Kesimpulan Valuasi</div><div class="m-v">${s.fundamental?.verdict ?? 'N/A'}</div></div>
      </div>
    </div>

    <div class="m-sec">
      <div class="m-title">🕵️ Collector Status</div>
      <div class="m-grid">
        <div class="m-item"><div class="m-l">Status</div><div class="m-v">${s.collector_status?.status_text ?? '-'}</div></div>
        <div class="m-item"><div class="m-l">Jarak dari Bottom (50H)</div><div class="m-v">${s.collector_status?.distance_from_low ?? 'N/A'}</div></div>
      </div>
    </div>

    <div class="m-sec">
      <div class="m-title">🎯 Action Plan</div>
      <div class="azones">
        <div class="az buy"><div class="az-l">Buy Zone</div><div class="az-v">$${(s.action_plan?.buy_zone || 0).toFixed(2)}</div></div>
        <div class="az target"><div class="az-l">Target Sell</div><div class="az-v">$${(s.action_plan?.target_sell || 0).toFixed(2)}</div></div>
        <div class="az stop"><div class="az-l">Stop Loss</div><div class="az-v">$${(s.action_plan?.stop_loss || 0).toFixed(2)}</div></div>
      </div>
      <div class="m-grid" style="margin-top:6px">
        <div class="m-item full"><div class="m-l">Potensi Profit</div><div class="m-v" style="color:var(--orange);font-size:16px">+${s.action_plan?.potential_profit ?? 'N/A'}</div></div>
      </div>
    </div>
  `;
  document.getElementById('modal').classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

async function fetchData() {
  try {
    const r = await fetch('data.json?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    allData = d.stocks || [];

    updateStats(d);
    renderFilters();
    renderSorts();
    applyFilters();
  } catch (e) {
    console.error(e);
    document.getElementById('grid').innerHTML = '<div class="empty">️ Gagal memuat data. Periksa data.json.</div>';
  }
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  applyFilters();
});

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

fetchData();
</script>
</body>
</html>
